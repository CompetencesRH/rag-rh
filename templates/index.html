<div class="selector">
    <select id="docPicker">
        {% for file in files %}
            <option value="{{ file }}">{{ file }}</option>
        {% endfor %}
    </select>
    <button onclick="loadDoc()">Charger ce document</button>
</div>

<script>
async function loadDoc() {
    const filename = document.getElementById('docPicker').value;
    const btn = event.target;
    btn.innerText = "Chargement...";
    
    const res = await fetch('/select_doc', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ filename: filename })
    });
    const data = await res.json();
    alert(data.message || data.error);
    btn.innerText = "Charger ce document";
}
</script>
